name: PieFi OS V8 Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout PieFi OS
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache clang flex bison g++ gawk gcc-multilib gettext git libncurses-dev libssl-dev python3-dev rsync unzip zlib1g-dev file wget

      - name: Clone OpenWrt
        run: |
          git clone --depth 1 https://github.com/openwrt/openwrt.git openwrt

      - name: Copy PieFi package
        run: |
          mkdir -p openwrt/package/piefi-controller
          cp -a package/piefi-controller/. openwrt/package/piefi-controller/

      - name: Copy PieFi build configuration
        run: |
          cp piefi-build/.config openwrt/.config

      - name: Configure build
        working-directory: openwrt
        run: |
          make defconfig

      - name: Download sources
        working-directory: openwrt
        run: |
          make download -j8

      - name: Build firmware
        working-directory: openwrt
        run: |
          make -j2 || make -j1

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PieFi-OS-V8-Firmware
          path: openwrt/bin/targets/x86/64/
          if-no-files-found: error
          retention-days: 14
