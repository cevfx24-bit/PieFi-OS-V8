<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>PieFi Controller</title><style>body{font-family:system-ui;max-width:900px;margin:2em auto;padding:1em}input,button{padding:8px;margin:5px}pre{background:#eee;padding:1em;overflow:auto}</style></head><body><h1>PieFi Controller</h1><p>Prototype local admin panel. API token is required; enter it below.</p><input id="t" placeholder="API token" size="40"><button onclick="load()">Load status</button><h2>Create voucher</h2><input id="m" type="number" value="30"><input id="n" type="number" value="1"><button onclick="create()">Create</button><pre id="out"></pre><script>async function api(p,o={}){let t=document.getElementById('t').value;return fetch(p,{...o,headers:{'Authorization':'Bearer '+t,'Content-Type':'application/json',...(o.headers||{})}})}async function load(){let r=await api('/api/v1/vouchers');document.getElementById('out').textContent=await r.text()}async function create(){let r=await api('/api/v1/vouchers',{method:'POST',body:JSON.stringify({minutes:+m.value,count:+n.value})});document.getElementById('out').textContent=await r.text()}</script></body></html>
